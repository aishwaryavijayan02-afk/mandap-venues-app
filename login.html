<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8ff" />
    <meta name="description" content="Sign in to Mandap & Venues." />
    <script src="./theme.js"></script>
    <title>Log In — Mandap & Venues</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./login.css" />
    <script src="./password-toggle.js" defer></script>
    <script src="./login.js" defer></script>
  </head>
  <body>
    <main class="login-shell">
      <header class="login-header">
        <a class="login-back" href="./index.html" aria-label="Back to home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7" /></svg>
          <span>Home</span>
        </a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.8 8.8 0 0 1 8.8 3.5 8.8 8.8 0 1 0 20.5 15.2Z" /></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </header>

      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Welcome back</h1>
        <p class="login-intro">Log in to continue planning your event.</p>

        <form id="login-form">
          <label for="login-email">Email address</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />

          <label for="login-password">Password</label>
          <div class="password-field">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password" />
            <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">Show</button>
          </div>

          <button class="login-submit" type="submit">Log In</button>
        </form>
        <p class="login-status" id="login-status" role="status" aria-live="polite" hidden></p>
        <a class="login-home-link" href="./index.html">Continue browsing venues</a>
        <a class="admin-demo-link" href="./admin.html">Admin image manager · demo</a>
      </section>
    </main>
  </body>
</html>
