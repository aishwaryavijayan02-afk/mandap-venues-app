<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8ff" />
    <meta name="description" content="View your venue conversations." />
    <script src="./theme.js"></script>
    <title>Chats — Weddings &amp; Events Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      rel="stylesheet"
    />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./secondary-pages.css" />
  </head>
  <body>
    <main class="secondary-shell">
      <header class="secondary-header">
        <a class="secondary-brand" href="./index.html" aria-label="Weddings and Events Booking home"><img src="./logo.png" alt="" /></a>
        <h1>Chats</h1>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.8 8.8 0 0 1 8.8 3.5 8.8 8.8 0 1 0 20.5 15.2Z" /></svg>

        </button>
      </header>
      <section class="secondary-content" aria-labelledby="chats-heading">
        <h2 id="chats-heading">Venue conversations</h2>
        <div class="empty-panel">
          <span class="empty-icon" aria-hidden="true">◌</span>
          <h3>No conversations yet</h3>
          <p>Venue messaging is not connected in this demo. You can still browse venues and review their details.</p>
          <a class="secondary-action" href="./venues.html">Explore venues</a>
        </div>
      </section>
      <nav class="secondary-nav" aria-label="Main navigation">
        <a class="secondary-nav-item" href="./index.html"><span aria-hidden="true">⌂</span>Home</a>
        <a class="secondary-nav-item" href="./bookings.html"><span aria-hidden="true">▦</span>Bookings</a>
        <a class="secondary-nav-item active" href="./chats.html" aria-current="page"><span aria-hidden="true">◌</span>Chats</a>
        <a class="secondary-nav-item" href="./login.html"><span aria-hidden="true">◎</span>Profile</a>
