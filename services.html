<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8ff" />
    <meta name="description" content="Explore event services for your celebration." />
    <script src="./theme.js"></script>
    <title>Event Services — Weddings &amp; Events Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./secondary-pages.css" />
    <link rel="stylesheet" href="./services.css" />
    <script src="./services.js" defer></script>
  </head>
  <body>
    <main class="secondary-shell service-shell">
      <header class="secondary-header">
        <a class="secondary-brand" href="./index.html" aria-label="Weddings and Events Booking home"><img src="./logo.png" alt="" /></a>
        <h1 id="service-title">Event Services</h1>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.8 8.8 0 0 1 8.8 3.5 8.8 8.8 0 1 0 20.5 15.2Z" /></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </header>

      <section class="secondary-content service-content" aria-labelledby="service-heading">
        <span class="service-eyebrow">PLAN YOUR CELEBRATION</span>
        <h2 id="service-heading">Choose a service</h2>
        <p class="secondary-intro" id="service-description"></p>
        <form id="service-form" class="service-form">
          <fieldset>
            <legend id="service-options-label">Available options</legend>
            <div class="service-options" id="service-options"></div>
          </fieldset>
          <label class="service-field" for="service-event-date">Event date
            <input id="service-event-date" name="eventDate" type="date" required />
          </label>
          <label class="service-field" for="service-location">Event location
            <input id="service-location" name="location" type="text" maxlength="80" required />
          </label>
          <button class="secondary-action service-submit" type="submit">Save my selection</button>
        </form>
        <p class="service-status" id="service-status" role="status" aria-live="polite" hidden></p>
        <p class="service-demo-note">Demo only: selections are saved in this browser. No provider request is sent.</p>
        <a class="service-back-link" href="./index.html">Back to home</a>
      </section>

      <nav class="secondary-nav" aria-label="Main navigation">
        <a class="secondary-nav-item" href="./index.html"><span aria-hidden="true">⌂</span>Home</a>
        <a class="secondary-nav-item" href="./bookings.html"><span aria-hidden="true">▦</span>Bookings</a>
        <a class="secondary-nav-item" href="./chats.html"><span aria-hidden="true">◌</span>Chats</a>
        <a class="secondary-nav-item" href="./login.html"><span aria-hidden="true">◎</span>Profile</a>
      </nav>
    </main>
  </body>
</html>
